name: iOS tests
# The Swift of ios/. The Anyline SDK ships no macOS slice and no arm64 simulator slice, so the plugin layer cannot run on
# a simulator of an arm64 runner: the core (the result mapping, the waiting calls) is tested with `swift test` on the Mac
# itself, and the package is built for a generic iOS device. The build-phase script is tested by `npm test`.
# Run by hand only (Actions > iOS tests > Run workflow): its jobs need macOS runners, whose minutes a private repository
# pays for, so neither a push nor a pull request starts it, and ci.yaml does not wait on it. Run it before a release that
# touches ios/, Package.swift or the podspec, or verify on a Mac with `npm run test:ios` and `npm run verify:ios`.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npm run test:ios
  # The Swift of ios/Sources against capacitor-swift-pm and the Anyline SDK, built for a generic iOS device.
  device:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm run verify:ios
      - name: Stop what the build left running
        if: always()
        run: pkill -f '[x]codebuild' || true
