name: CI
# One workflow for what a change goes through, parameterised by what triggered it (see `plan`):
#
#   a pull request  runs the tests its change needs, and ends in `ci`, the one job a ruleset on main can require;
#   a push to main  does the same for everything, then publishes the version in package.json to npm as `latest`;
#   a run by hand   (workflow_dispatch) tests everything and never publishes, unless `publish_only` is ticked: then, on main
#                   only, it runs the parity check and publishes, skipping the unit, iOS and Android tests. That is the way out
#                   when a release commit passed its tests but a hosted runner never picked a job up (GitHub's macOS queue).
#
# npm's trusted publishing is tied to this file name: the package's Settings > Trusted Publisher on npmjs.com names this
# repository and this file (ci.yaml), with no environment. There is no npm token to expire. A push that keeps the version
# publishes nothing, so a release is a version bump merged to main.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_only:
        description: 'Publish the version on main without the unit, iOS and Android tests (parity still runs)'
        type: boolean
        default: false
permissions:
  contents: read
# A newer push to a pull request cancels the run before it. A push to main never cancels another: it may be the one that publishes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The two platforms, the TypeScript API and the README have to agree before anything longer is run: every method has its native
  # method on both platforms, under the same plugin name, and its section in the README. It costs seconds.
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: node --test test/unit/platform-parity.test.mjs
  # Everything that depends on what triggered the run is decided here, once:
  #   ios, android  which of the longer tests are needed: all of them for a push, and for a pull request the ones whose code,
  #                 tests or shared files (the TypeScript, the manifest, the workflow) it changes
  #   unit          whether the unit tests run: always, except for a publish-only run
  #   publish       whether the run ends in a publish: a push to main, or a publish-only run by hand on main. Trusted publishing is tied
  #                 to this file's name and not to a branch, so a run by hand on any other branch would publish the version it carries if
  #                 this said yes: a publish-only run anywhere but main fails here instead
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.plan.outputs.ios }}
      android: ${{ steps.plan.outputs.android }}
      unit: ${{ steps.plan.outputs.unit }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PUBLISH_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_only }}
          REF: ${{ github.ref }}
        run: |
          unit=true
          if [ "$PUBLISH_ONLY" = "true" ]; then
            if [ "$REF" != "refs/heads/main" ]; then
              echo "A publish-only run publishes the version it carries, so it runs on main only, not on $REF"
              exit 1
            fi
            ios=false
            android=false
            unit=false
            publish=true
          elif [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "$BASE" HEAD)
            echo "$files"
            shared='src/|example-app/|package\.json$|package-lock\.json$|\.github/workflows/ci\.yaml$'
            ios=$(echo "$files" | grep -Eq "^(ios/|scripts/ios/|Package\.swift$|[^/]+\.podspec$|$shared|\.github/workflows/test-ios\.yaml$)" && echo true || echo false)
            android=$(echo "$files" | grep -Eq "^(android/|$shared|\.github/workflows/test-android\.yaml$)" && echo true || echo false)
            publish=false
          else
            ios=true
            android=true
            publish=false
            if [ "$EVENT" = "push" ]; then
              publish=true
            fi
          fi
          {
            echo "ios=$ios"
            echo "android=$android"
            echo "unit=$unit"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
  unit:
    needs: [parity, plan]
    if: needs.plan.outputs.unit == 'true'
    uses: ./.github/workflows/test.yaml
  ios:
    needs: [parity, plan]
    if: needs.plan.outputs.ios == 'true'
    uses: ./.github/workflows/test-ios.yaml
  android:
    needs: [parity, plan]
    if: needs.plan.outputs.android == 'true'
    uses: ./.github/workflows/test-android.yaml
  # The one job a ruleset requires. A job that was skipped because the change does not need it is fine; one that failed or was
  # cancelled is not.
  ci:
    if: always()
    needs: [parity, plan, unit, ios, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.parity.result }} ${{ needs.plan.result }} ${{ needs.unit.result }} ${{ needs.ios.result }} ${{ needs.android.result }}
        run: |
          echo "parity plan unit ios android: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job did not pass"; exit 1 ;;
            esac
          done
  # Only a push to main or a publish-only run on main gets here, and only when `ci` is green. dist/ is not committed: it is built here, from the source that passed.
  publish:
    needs: [plan, ci]
    # Not success(): it reads the whole chain of needs, so the tests a publish-only run skips would skip this job too. `ci` already
    # holds every result that has to pass.
    if: always() && needs.ci.result == 'success' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm's trusted publishing signs in with this
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          # npm 11.5 or newer is needed for trusted publishing
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          # a publishing job does not restore a dependency cache (setup-node's advice for trusted publishing)
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: The README is the one docgen writes from the source
        run: git diff --exit-code -- README.md
      - name: Publish a version that is new
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published: nothing to do"
            exit 0
          fi
          npm publish --provenance --access public
