name: CI
# One workflow for what a change goes through, parameterised by what triggered it (see `plan`):
#
#   a pull request  runs the tests its change needs, and ends in `ci`, the one job a ruleset on main can require;
#   a push to main  does the same for everything, then publishes the version in package.json to GitHub Packages;
#   a run by hand   (workflow_dispatch) tests everything and never publishes.
#
# Every job here runs on Linux. The iOS jobs need a macOS runner, whose minutes a private repository pays for, so they are
# a workflow of their own (test-ios.yaml) that runs only by hand, and nothing here waits on them.
#
# The package is published to GitHub Packages with the workflow's own GITHUB_TOKEN; there is no token to keep. A push that
# keeps the version publishes nothing, so a release is a version bump merged to main.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
# A newer push to a pull request cancels the run before it. A push to main never cancels another: it may be the one that publishes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # The two platforms, the TypeScript API and the README have to agree before anything longer is run: every method has its native
  # method on both platforms, under the same plugin name, and its section in the README. It costs seconds.
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: node --test test/unit/platform-parity.test.mjs
  # Everything that depends on what triggered the run is decided here, once:
  #   android  whether the Android build is needed: always for a push, and for a pull request when it changes the Android code,
  #            its tests or shared files (the TypeScript, the manifest, the workflow)
  #   publish  whether the run ends in a publish: a push to main, and nothing else
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.plan.outputs.android }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "$BASE" HEAD)
            echo "$files"
            shared='src/|package\.json$|package-lock\.json$|\.github/workflows/ci\.yaml$'
            android=$(echo "$files" | grep -Eq "^(android/|$shared|\.github/workflows/test-android\.yaml$)" && echo true || echo false)
            publish=false
          else
            android=true
            publish=false
            if [ "$EVENT" = "push" ]; then
              publish=true
            fi
          fi
          {
            echo "android=$android"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
  unit:
    needs: parity
    uses: ./.github/workflows/test.yaml
  android:
    needs: [parity, plan]
    if: needs.plan.outputs.android == 'true'
    uses: ./.github/workflows/test-android.yaml
  # The one job a ruleset requires. A job that was skipped because the change does not need it is fine; one that failed or was
  # cancelled is not.
  ci:
    if: always()
    needs: [parity, plan, unit, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ needs.parity.result }} ${{ needs.plan.result }} ${{ needs.unit.result }} ${{ needs.android.result }}
        run: |
          echo "parity plan unit android: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job did not pass"; exit 1 ;;
            esac
          done
  # Only a push to main gets here, and only when `ci` is green. dist/ is not committed: it is built here, from the source that passed.
  publish:
    needs: [plan, ci]
    if: success() && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@maximbelov'
          # a publishing job does not restore a dependency cache
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: The README is the one docgen writes from the source
        run: git diff --exit-code -- README.md
      - name: Publish a version that is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "$name@$version is already published: nothing to do"
            exit 0
          fi
          npm publish
